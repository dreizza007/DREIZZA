
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DREIZZA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
      background: #fff;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #222;
      font-size: 14px;
      transition: 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* =========================
       BANNER
    ========================= */

    .banner {
      position: relative;
      width: 100%;
      height: 650px;
      overflow: hidden;
      background: #000;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .banner-video {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

      z-index: 0;
    }

    .banner::after {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background: rgba(0, 0, 0, 0.20);

      z-index: 1;
    }

    .banner-content {
      position: relative;

      z-index: 2;

      padding: 20px;

      text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.6);
    }

    .banner h1 {
      font-size: 48px;

      margin: 0 0 15px;

      letter-spacing: 6px;
    }

    .banner p {
      font-size: 19px;

      margin: 0 0 30px;
    }

    .banner-button {
      display: inline-block;

      padding: 14px 30px;

      background: #fff;

      color: #222;

      text-decoration: none;

      font-size: 14px;

      font-weight: bold;

      letter-spacing: 1px;

      border-radius: 2px;

      transition: 0.3s;
    }

    .banner-button:hover {
      background: #222;
      color: #fff;
    }

    /* =========================
       PRODUTOS
    ========================= */

    .produtos {
      padding: 60px 20px;

      text-align: center;

      background: #fff;
    }

    .produtos h2 {
      font-size: 28px;

      margin: 0 0 40px;

      letter-spacing: 3px;
    }

    .produtos-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 20px;

      max-width: 1200px;

      margin: 0 auto;
    }

    .produto {
      background: #fff;

      text-align: left;

      overflow: hidden;
    }

    .produto img {
      width: 100%;

      height: 350px;

      object-fit: cover;

      display: block;

      transition: 0.3s;
    }

    .produto:hover img {
      transform: scale(1.02);
    }

    .produto-info {
      padding: 15px 0;
    }

    .produto-nome {
      font-size: 15px;

      margin-bottom: 8px;
    }

    .produto-preco {
      font-size: 16px;

      font-weight: bold;
    }

    /* =========================
       RODAPÉ
    ========================= */

    footer {
      margin-top: 20px;

      padding: 35px 20px;

      text-align: center;

      border-top: 1px solid #eee;

      background: #fff;

      font-size: 13px;

      color: #555;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 768px) {

      header {
        padding: 18px 10px;
      }

      .logo {
        font-size: 26px;
      }

      nav {
        margin-top: 12px;
      }

      nav a {
        margin: 0 6px;

        font-size: 13px;
      }

      .banner {
        height: 550px;
      }

      .banner h1 {
        font-size: 34px;

        letter-spacing: 4px;
      }

      .banner p {
        font-size: 16px;
      }

      .produtos {
        padding: 45px 15px;
      }

      .produtos h2 {
        font-size: 24px;

        margin-bottom: 30px;
      }

      .produtos-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 15px;
      }

      .produto img {
        height: 280px;
      }

    }

    /* =========================
       CELULAR PEQUENO
    ========================= */

    @media (max-width: 480px) {

      .banner {
        height: 500px;
      }

      .banner h1 {
        font-size: 28px;
      }

      .banner p {
        font-size: 15px;
      }

      .banner-button {
        padding: 12px 24px;

        font-size: 13px;
      }

      .produtos-grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }

      .produto img {
        height: 240px;
      }

      .produto-nome {
        font-size: 13px;
      }

      .produto-preco {
        font-size: 14px;
      }

    }

  </style>

</head>
