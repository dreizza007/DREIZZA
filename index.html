<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DREIZZA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    /* LOGO */

    .logo {
      text-align: center;
      padding-top: 20px;
    }

    .logo img {
      width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* CABEÇALHO */

    header {
      background: #fff;
      border-bottom: 1px solid #eee;
      text-align: center;
      padding-bottom: 25px;
    }

    nav {
      margin-top: 20px;
    }

    nav a {
      margin: 0 22px;
      text-decoration: none;
      color: #222;
      font-size: 16px;
    }

    nav a:hover {
      opacity: 0.6;
    }

    /* BANNER */

    .banner {
      position: relative;
      width: 100%;
      height: 460px;
      overflow: hidden;
      background: #000;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .banner-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

      z-index: 0;
    }

    .banner::after {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.38);

      z-index: 1;
    }

    .banner-content {
      position: relative;
      z-index: 2;

      padding: 20px;
    }

    .banner h1 {
      margin: 0 0 18px;

      font-size: 52px;

      font-weight: bold;
    }

    .banner p {
      margin: 0 0 30px;

      font-size: 20px;
    }

    .button {
      display: inline-block;

      background: #222;
      color: #fff;

      padding: 16px 32px;

      text-decoration: none;

      font-size: 15px;
    }

    .button:hover {
      background: #000;
    }

    /* PRODUTOS */

    .section {
      padding: 32px 7% 45px;
      max-width: 1400px;
      margin: auto;
    }

    .section h2 {
      text-align: center;

      font-size: 30px;

      margin: 0 0 25px;
    }

    .products {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 45px;
    }

    .product {
      text-align: left;
    }

    .product-image {
      width: 100%;
      height: 190px;

      background: #eee;

      margin-bottom: 16px;
    }

    .product h3 {
      margin: 0 0 8px;

      font-size: 16px;
    }

    .price {
      margin: 0;

      font-weight: bold;

      font-size: 15px;
    }

    /* RODAPÉ */

    footer {
      padding: 25px 20px;

      text-align: center;

      background: #222;

      color: #fff;

      font-size: 14px;
    }

    /* CELULAR */

    @media (max-width: 767px) {

      .logo {
        padding-top: 25px;
      }

      .logo img {
        width: 180px;
      }

      nav {
        margin-top: 35px;
      }

      nav a {
        margin: 0 8px;
        font-size: 16px;
      }

      .banner {
        height: 520px;
      }

      .banner-video {
        object-fit: cover;
      }

      .banner h1 {
        font-size: 42px;
      }

      .banner p {
        font-size: 18px;
      }

      .button {
        padding: 15px 28px;
      }

      .section {
        padding: 45px 20px;
      }

      .section h2 {
        font-size: 28px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px 15px;
      }

      .product-image {
        height: 180px;
      }
    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      <img src="1000215629.jpg" alt="DREIZZA">
    </div>

    <nav>
      <a href="#">Início</a>
      <a href="#">Produtos</a>
      <a href="#">Promoções</a>
      <a href="#">Carrinho</a>
    </nav>

  </header>


  <section class="banner">

    <video
      class="banner-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto">

      <source
        src="https://dreizza007.github.io/DREIZZA/DREIZZA_banner.mp4"
        type="video/mp4">

      Seu navegador não suporta vídeo.

    </video>


    <div class="banner-content">

      <h1>Nova coleção</h1>

      <p>Descubra seu novo estilo na DREIZZA</p>

      <a href="#" class="button">
        COMPRAR AGORA
      </a>

    </div>

  </section>


  <section class="section">

    <h2>Produtos em destaque</h2>

    <div class="products">

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 01</h3>
        <p class="price">R$ 79,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 02</h3>
        <p class="price">R$ 89,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 03</h3>
        <p class="price">R$ 99,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 04</h3>
        <p class="price">R$ 69,90</p>
      </div>

    </div>

  </section>


  <footer>

    © 2026 DREIZZA — Todos os direitos reservados.

  </footer>

</body>

</html>
