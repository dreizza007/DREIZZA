<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DREIZZA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    /* LOGO */

    .logo {
      text-align: center;
    }

    .logo img {
      width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* CABEÇALHO */

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
      background: #fff;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #222;
      font-size: 14px;
    }

    /* BANNER */

    .banner {
      position: relative;
      width: 100%;
      min-height: 500px;
      overflow: hidden;
      background: #000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .banner-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 0;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 1;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      padding: 20px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .banner h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    .banner p {
      font-size: 18px;
      margin: 0 0 25px;
    }

    .button {
      display: inline-block;
      background: #222;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 16px;
      text-shadow: none;
    }

    .button:hover {
      background: #444;
    }

    /* PRODUTOS */

    .section {
      padding: 50px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .product {
      text-align: center;
    }

    .product-image {
      height: 260px;
      background: #eee;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
    }

    /* RODAPÉ */

    footer {
      margin-top: 50px;
      padding: 40px 20px;
      text-align: center;
      background: #222;
      color: white;
    }

    /* CELULAR */

    @media (max-width: 767px) {

      .logo img {
        width: 150px;
      }

      nav a {
        margin: 0 5px;
        font-size: 13px;
      }

      .banner {
        min-height: 520px;
      }

      .banner-video {
        object-fit: contain;
      }

      .banner h1 {
        font-size: 32px;
      }

      .banner p {
        font-size: 16px;
      }

      .banner-content {
        padding: 20px;
      }

      .button {
        padding: 14px 25px;
      }
    }

    /* COMPUTADOR */

    @media (min-width: 768px) {

      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      .banner {
        min-height: 550px;
      }

      .banner h1 {
        font-size: 56px;
      }

      .banner p {
        font-size: 20px;
      }
    }

  </style>

</head>

<body>

  <!-- CABEÇALHO -->

  <header>

    <div class="logo">
      <img src="./logo-dreizza.jpg" alt="DREIZZA">
    </div>

    <nav>
      <a href="#">Início</a>
      <a href="#">Produtos</a>
      <a href="#">Promoções</a>
      <a href="#">Carrinho</a>
    </nav>

  </header>


  <!-- BANNER COM VÍDEO -->

  <section class="banner">

    <video
      class="banner-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto">

      <source
        src="DREIZZA_banner.mp4"
        type="video/mp4">

      Seu navegador não suporta vídeo.

    </video>

    <div class="banner-content">

      <h1>Nova coleção</h1>

      <p>Descubra seu novo estilo na DREIZZA</p>

      <a href="#" class="button">COMPRAR AGORA</a>

    </div>

  </section>


  <!-- PRODUTOS -->

  <section class="section">

    <h2>Produtos em destaque</h2>

    <div class="products">

      <div class="product">

        <div class="product-image"></div>

        <h3>Produto 01</h3>

        <p class="price">R$ 79,90</p>

      </div>


      <div class="product">

        <div class="product-image"></div>

        <h3>Produto 02</h3>

        <p class="price">R$ 89,90</p>

      </div>


      <div class="product">

        <div class="product-image"></div>

        <h3>Produto 03</h3>

        <p class="price">R$ 99,90</p>

      </div>


      <div class="product">

        <div class="product-image"></div>

        <h3>Produto 04</h3>

        <p class="price">R$ 69,90</p>

      </div>

    </div>

  </section>


  <!-- RODAPÉ -->

  <footer>

    <p>© 2026 DREIZZA — Todos os direitos reservados.</p>

  </footer>


</body>

</html>
