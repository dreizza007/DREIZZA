<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREIZZA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #222;
      font-size: 14px;
    }

    .banner {
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f3f3f3;
      padding: 30px;
    }

    .banner h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .banner p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #222;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
    }

    .section {
      padding: 50px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .product {
      text-align: center;
    }

    .product-image {
      height: 260px;
      background: #eee;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
    }

    footer {
      margin-top: 50px;
      padding: 40px 20px;
      text-align: center;
      background: #222;
      color: white;
    }

    @media (min-width: 768px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DREIZZA</div>

    <nav>
      <a href="#">Início</a>
      <a href="#">Produtos</a>
      <a href="#">Promoções</a>
      <a href="#">Carrinho</a>
    </nav>
  </header>

  <section class="banner">
    <div>
      <h1>Nova coleção</h1>
      <p>Descubra seu novo estilo na DREIZZA</p>
      <a href="#" class="button">COMPRAR AGORA</a>
    </div>
  </section>

  <section class="section">
    <h2>Produtos em destaque</h2>

    <div class="products">

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 01</h3>
        <p class="price">R$ 79,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 02</h3>
        <p class="price">R$ 89,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 03</h3>
        <p class="price">R$ 99,90</p>
      </div>

      <div class="product">
        <div class="product-image"></div>
        <h3>Produto 04</h3>
        <p class="price">R$ 69,90</p>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 DREIZZA — Todos os direitos reservados.</p>
  </footer>

</body>
</html>
